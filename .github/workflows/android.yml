name: Build APK

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Lấy mã nguồn
        uses: actions/checkout@v4

      - name: Cài Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Cài Gradle (có bộ nhớ đệm)
        uses: gradle/actions/setup-gradle@v4

      - name: Chạy kiểm thử lõi âm lịch
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Build APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Đổi tên APK
        run: cp app/build/outputs/apk/debug/app-debug.apk LichAmDuong.apk

      - name: Tải APK lên trang kết quả
        uses: actions/upload-artifact@v4
        with:
          name: LichAmDuong-apk
          path: LichAmDuong.apk
          retention-days: 30
