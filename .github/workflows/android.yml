name: Build APK

on:
  push:
    branches: [main]
    paths-ignore: ["web/**", ".github/workflows/pages.yml"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Lấy mã nguồn
        uses: actions/checkout@v4

      - name: Cài Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Cài Gradle (có bộ nhớ đệm)
        uses: gradle/actions/setup-gradle@v4

      - name: Chạy kiểm thử lõi âm lịch
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Build APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Đổi tên APK
        run: cp app/build/outputs/apk/debug/app-debug.apk LichAmDuong.apk

      - name: Tải APK lên trang kết quả
        uses: actions/upload-artifact@v4
        with:
          name: LichAmDuong-apk
          path: LichAmDuong.apk
          retention-days: 30

      # Mỗi lần cập nhật nhánh main: đăng APK lên mục Releases.
      # Link tải luôn trỏ bản mới nhất: /releases/latest/download/LichAmDuong.apk
      - name: Đăng bản phát hành
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="v1.0.${{ github.run_number }}"
          gh release create "$TAG" LichAmDuong.apk \
            --repo "${{ github.repository }}" \
            --title "Lịch Âm Dương $TAG" \
            --notes "Bản Android build tự động từ commit ${{ github.sha }}. Tải file LichAmDuong.apk về điện thoại Android rồi mở để cài (cho phép cài ứng dụng từ nguồn này nếu máy hỏi)." \
            --latest
